<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A93">
<title>Paper & Coating GSM</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: #EAF0FA; color: #1B2A4A; font-family: "Segoe UI", Roboto, system-ui, sans-serif; }
  .wrap { max-width: 440px; margin: 0 auto; }
  header { background: #1F3A93; color: #fff; text-align: center; padding: 16px 12px; }
  header h1 { margin: 0; font-size: 1.15rem; letter-spacing: .03em; }
  header p { margin: 4px 0 0; font-size: .8rem; color: #BFD0FF; }
  main { padding: 14px 16px 24px; }
  .card { background: #fff; border: 1px solid #C5D0E8; padding: 6px 14px 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; }
  .row label { font-size: 1rem; }
  .row input { width: 8.5rem; font-size: 1.15rem; text-align: right; padding: 8px 10px; border: 2px solid #C5D0E8; background: #F4F7FD; color: #1B2A4A; border-radius: 0; }
  .row input:focus { outline: none; border-color: #1F3A93; }
  .row input[readonly] { background: #E3E9F5; }
  #msg { color: #C62828; font-size: .85rem; font-weight: 700; min-height: 2.6em; white-space: pre-line; padding-top: 4px; }
  .res { color: #fff; margin-top: 12px; padding: 10px 16px 12px; }
  .res .t { font-size: .85rem; font-weight: 700; letter-spacing: .03em; }
  .res .v { font-size: 2.1rem; font-weight: 700; }
  .res .u { font-size: 1rem; margin-left: 6px; }
  #r1 { background: #2563EB; } #r2 { background: #F59E0B; } #r3 { background: #059669; }
  button { width: 100%; margin-top: 16px; padding: 12px; border: 0; background: #7C3AED; color: #fff; font-size: 1.05rem; font-weight: 700; }
  button:active { background: #5B21B6; }
  .note { margin-top: 12px; text-align: center; font-size: .75rem; color: #5A6B8C; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Paper &amp; Coating GSM</h1><p>Precision weighing method</p></header>
  <main>
    <div class="card">
      <div class="row"><label for="w">Paper width (cm)</label><input id="w" inputmode="decimal" value="10"></div>
      <div class="row"><label for="l">Paper length (cm)</label><input id="l" inputmode="decimal" value="10"></div>
      <div class="row"><label for="a">Area (m²) auto</label><input id="a" readonly></div>
      <div class="row"><label for="b">Before coating wt (g)</label><input id="b" inputmode="decimal"></div>
      <div class="row"><label for="c">After coating wt (g)</label><input id="c" inputmode="decimal"></div>
      <div id="msg"></div>
    </div>
    <div class="res" id="r1"><div class="t">GSM OF PAPER</div><span class="v" id="pg">—</span><span class="u">g/m²</span></div>
    <div class="res" id="r2"><div class="t">COATING WEIGHT</div><span class="v" id="cw">—</span><span class="u">g</span></div>
    <div class="res" id="r3"><div class="t">GSM OF COATING</div><span class="v" id="cg">—</span><span class="u">g/m²</span></div>
    <button id="clr" type="button">CLEAR</button>
    <div class="note">GSM = weight ÷ area (m²) &nbsp;•&nbsp; 10 × 10 cm: GSM = weight × 100</div>
  </main>
</div>
<script>
  const $ = id => document.getElementById(id);
  const num = s => {
    s = s.trim().replace(",", ".");
    if (s === "") return null;
    const n = Number(s);
    return Number.isFinite(n) ? n : null;
  };

  function update() {
    const w = num($("w").value), l = num($("l").value);
    const b = num($("b").value), c = num($("c").value);
    let msg = [];

    if (w === null || l === null || w <= 0 || l <= 0) {
      $("a").value = ""; $("pg").textContent = $("cw").textContent = $("cg").textContent = "—";
      $("msg").textContent = "Enter a valid Width and Length (cm).";
      return;
    }
    const area = w * l / 10000;
    $("a").value = String(parseFloat(area.toFixed(4)));

    const pg = b !== null ? b / area : null;
    $("pg").textContent = pg === null ? "—" : pg.toFixed(2);
    if (pg !== null && pg > 1500)
      msg.push("Check: weights must be in GRAMS for the cut piece (e.g. 2.000 g = 200 GSM on 10 x 10 cm), not the GSM value.");

    if (b === null || c === null) {
      $("cw").textContent = $("cg").textContent = "—";
    } else {
      const coat = c - b;
      $("cw").textContent = coat.toFixed(4);
      $("cg").textContent = (coat / area).toFixed(2);
      if (coat < 0) msg.push("Warning: After coating is less than Before coating.");
    }
    $("msg").textContent = msg.join("\n");
  }

  ["w", "l", "b", "c"].forEach(id => $(id).addEventListener("input", update));
  $("clr").addEventListener("click", () => {
    $("w").value = "10"; $("l").value = "10"; $("b").value = ""; $("c").value = "";
    update(); $("b").focus();
  });
  update();
</script>
</body>
</html>
